packages:
  - apps/*
  - packages/*
  - tools/*
  - ops
overrides:
  # sharp <0.35.5 carries the librsvg advisory (GHSA-wq5f-xc86-pv6w). It arrives
  # as an optional dependency of next, whose range already allows the fix, so this
  # only stops the lockfile pinning the older one.
  sharp: 0.35.5
allowBuilds:
  esbuild: true
  '@biomejs/biome': true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.53'
  - '@ai-sdk/gateway@4.0.80'
  - '@ai-sdk/openai@4.0.66'
  - '@ai-sdk/provider-utils@5.0.40'
  - '@ai-sdk/provider@4.0.14'
  - ai@7.0.99
  - cn@0.3.0
