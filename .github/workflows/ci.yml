name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    env:
      # Ephemeral per-run password — nothing committed, no secret management.
      # The service container, psql steps, and test env all derive from this.
      PG_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PG_USER: claimwatch
      PG_HOST: localhost
      PG_MAIN_DB: claimwatch_test
    services:
      # Pinned Postgres + pgvector, same image as compose (CRO-R15 parity).
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: claimwatch
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: claimwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://claimwatch:${{ env.PG_PASSWORD }}@${{ env.PG_HOST }}:5432/${{ env.PG_MAIN_DB }}
      LABELS_DATABASE_URL: postgres://claimwatch:${{ env.PG_PASSWORD }}@${{ env.PG_HOST }}:5432/claimwatch_labels_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Pre-create per-suite scratch DBs (createTestStore self-creates them,
      # but pre-creation keeps CI independent of runtime CREATEDB privileges).
      - name: Create scratch databases
        run: |
          PGPASSWORD=${{ env.PG_PASSWORD }} psql -h ${{ env.PG_HOST }} -U ${{ env.PG_USER }} -d ${{ env.PG_MAIN_DB }} -c "CREATE DATABASE claimwatch_test_flow" || true
          PGPASSWORD=${{ env.PG_PASSWORD }} psql -h ${{ env.PG_HOST }} -U ${{ env.PG_USER }} -d ${{ env.PG_MAIN_DB }} -c "CREATE DATABASE claimwatch_labels_test" || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Scratch-Postgres migration chain from zero on every PR (STORE §2.4, CRO-R12).
      - run: pnpm db:migrate
      # Labels DB (separate database, HARNESS §2.4) — same chain-from-zero check.
      - run: pnpm db:migrate:labels
      - run: pnpm test