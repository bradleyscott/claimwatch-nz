name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    services:
      # Pinned Postgres + pgvector, same image as compose (CRO-R15 parity).
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: claimwatch
          POSTGRES_PASSWORD: claimwatch
          POSTGRES_DB: claimwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://claimwatch:claimwatch@localhost:5432/claimwatch_test
      LABELS_DATABASE_URL: postgres://claimwatch:claimwatch@localhost:5432/claimwatch_labels_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Scratch-Postgres migration chain from zero on every PR (STORE §2.4, CRO-R12).
      - run: pnpm db:migrate
        env:
          CREATE_LABELS_DB: "true"
      - run: pnpm test